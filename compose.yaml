# Local development database only. Production runs Postgres in Coolify on the Hostinger VPS.
# A fixed project name, so `pnpm db:up` in a git worktree finds this container instead of creating a second one with
# the same container_name (compose would otherwise name the project after the folder). Every checkout shares this
# Postgres, each e2e run with its own database (e2e/support/e2e-instance.ts), so `pnpm db:down` stops it for all of them,
# and `pnpm db:up` from a branch that changes this service recreates it for all of them.
name: cgendio-v2

services:
  db:
    image: postgres:18-alpine
    container_name: cgendio-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cgendio
      POSTGRES_PASSWORD: cgendio
      POSTGRES_DB: cgendio
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgendio -d cgendio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
