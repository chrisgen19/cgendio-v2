<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orchestrator</title>
<style>
  @font-face {font-family: 'Bricolage'; src: url('../../../../../../src/app/_fonts/bricolage-grotesque-latin-variable.woff2') format('woff2'); font-weight: 200 800;}
  @font-face {font-family: 'Geist'; src: url('../../../../../../src/app/_fonts/geist-latin-variable.woff2') format('woff2'); font-weight: 100 900;}
  @font-face {font-family: 'Geist Mono'; src: url('../../../../../../src/app/_fonts/geist-mono-latin-variable.woff2') format('woff2'); font-weight: 100 900;}
  body {margin: 0; background: #fff;}
  .eyebrow {font: 500 32px 'Geist Mono', monospace; letter-spacing: .08em; fill: #565B67;}
  .h {font: 700 70px 'Bricolage', sans-serif; letter-spacing: -.03em; fill: #0D0E12;}
  .m {font: 700 56px 'Bricolage', sans-serif; letter-spacing: -.02em;}
  .w {font: 700 48px 'Bricolage', sans-serif; letter-spacing: -.02em; fill: #0D0E12;}
  .s {font: 500 36px 'Geist', sans-serif; fill: #0D0E12;}
  .note {font: 500 33px 'Geist Mono', monospace; fill: #565B67;}
  .foot {font: 400 30px 'Geist Mono', monospace; fill: #565B67;}
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300">
  <title>Orchestrator pattern: one planner, cheap workers</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.3" fill="#E1E4EA"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3B2BFF"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="1299" rx="28" fill="#fff" stroke="#E3E5EA"/>
  <rect x="1" y="1" width="1198" height="1297" rx="28" fill="url(#dots)"/>

  <text x="60" y="100" class="eyebrow">ORCHESTRATOR PATTERN</text>
  <text x="60" y="182" class="h">One planner, cheap workers</text>

  <!-- Planner -->
  <rect x="60" y="240" width="1080" height="200" rx="22" fill="#0D0E12"/>
  <text x="96" y="310" class="m" fill="#fff">Fable 5.2</text>
  <text x="96" y="364" class="note" style="fill:#B9B2FF">plans the work, effort high</text>
  <text x="96" y="410" class="note" style="fill:#B9B2FF">1 call, short output</text>

  <!-- Fan out -->
  <line x1="480" y1="448" x2="240" y2="536" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="600" y1="448" x2="600" y2="536" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="720" y1="448" x2="960" y2="536" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Workers -->
  <rect x="60" y="546" width="340" height="170" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="92" y="620" class="w">Haiku 5.5</text>
  <text x="92" y="674" class="s">runs step 1</text>
  <rect x="430" y="546" width="340" height="170" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="462" y="620" class="w">Haiku 5.5</text>
  <text x="462" y="674" class="s">runs step 2</text>
  <rect x="800" y="546" width="340" height="170" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="832" y="620" class="w">Haiku 5.5</text>
  <text x="832" y="674" class="s">runs step 3</text>

  <text x="600" y="784" class="note" text-anchor="middle">in parallel, low effort,</text>
  <text x="600" y="830" class="note" text-anchor="middle">a fraction of the price</text>

  <!-- Merge -->
  <line x1="240" y1="724" x2="420" y2="930" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="960" y1="724" x2="780" y2="930" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="600" y1="852" x2="600" y2="930" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="200" y="940" width="800" height="130" rx="65" fill="#D7FF3D"/>
  <text x="600" y="1018" class="s" text-anchor="middle" style="font-weight:600;font-size:42px">Results merged in your code</text>

  <text x="60" y="1186" class="foot">Pattern from Anthropic's Fable 5.2 docs,</text>
  <text x="60" y="1228" class="foot">November 2026 · cgdiomampo.dev</text>
</svg>
</body>
</html>
