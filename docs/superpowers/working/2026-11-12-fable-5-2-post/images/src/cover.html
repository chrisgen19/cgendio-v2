<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  @font-face {font-family: 'Bricolage'; src: url('../../../../../../src/app/_fonts/bricolage-grotesque-latin-variable.woff2') format('woff2'); font-weight: 200 800;}
  @font-face {font-family: 'Geist'; src: url('../../../../../../src/app/_fonts/geist-latin-variable.woff2') format('woff2'); font-weight: 100 900;}
  @font-face {font-family: 'Geist Mono'; src: url('../../../../../../src/app/_fonts/geist-mono-latin-variable.woff2') format('woff2'); font-weight: 100 900;}
  body {margin: 0; background: #fff;}
  .display {font-family: 'Bricolage', sans-serif; font-weight: 700; letter-spacing: -0.04em;}
  .mono {font-family: 'Geist Mono', monospace; font-weight: 500;}
  .eyebrow {font-size: 36px; letter-spacing: 0.08em;}
  .h-small {font-size: 96px;}
  .h {font-size: 210px;}
  .sub {font-family: 'Geist', sans-serif; font-weight: 500; font-size: 50px;}
  /* Code indents use &#160;: plain leading spaces collapse in HTML-parsed SVG text */
  .code {font-size: 31px;}
  .file {font-size: 26px;}
</style>
</head>
<body>
<!-- Option C from the cover mockups: accent-tint stage, the title on the left, the post's own request settings on the right -->
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Claude Fable 5.2 for developers</title>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.5" fill="#D9D6FF"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#ECEBFF"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <text x="110" y="250" class="mono eyebrow" fill="#3B2BFF">FOR DEVELOPERS</text>
  <text x="106" y="380" class="display h-small" fill="#0D0E12">Claude</text>
  <!-- Highlighter under "5.2": 0.36em tall, 0.07em above the baseline, 0.06em past each side, measured in Bricolage -->
  <rect x="568" y="469.7" width="278" height="75.6" fill="#D7FF3D"/>
  <text x="100" y="560" class="display h" fill="#0D0E12">Fable 5.2</text>
  <text x="110" y="660" class="sub" fill="#565B67">for developers</text>

  <rect x="860" y="170" width="640" height="560" rx="26" fill="#0D0E12"/>
  <path d="M886 170 h588 a26 26 0 0 1 26 26 v48 h-640 v-48 a26 26 0 0 1 26 -26 z" fill="#1C1E25"/>
  <circle cx="900" cy="207" r="9" fill="#3A3D46"/>
  <circle cx="930" cy="207" r="9" fill="#3A3D46"/>
  <circle cx="960" cy="207" r="9" fill="#3A3D46"/>
  <text x="1480" y="216" text-anchor="end" class="mono file" fill="#7C818E">route.ts</text>
  <g class="mono code">
    <text x="900" y="330"><tspan fill="#E8E9EE">client.messages.stream({</tspan></text>
    <text x="900" y="390"><tspan fill="#E8E9EE">&#160;&#160;</tspan><tspan fill="#B9B2FF">model</tspan><tspan fill="#E8E9EE">: </tspan><tspan fill="#D7FF3D">'claude-fable-5-2'</tspan><tspan fill="#E8E9EE">,</tspan></text>
    <text x="900" y="450"><tspan fill="#E8E9EE">&#160;&#160;</tspan><tspan fill="#B9B2FF">output_config</tspan><tspan fill="#E8E9EE">: {</tspan></text>
    <text x="900" y="510"><tspan fill="#E8E9EE">&#160;&#160;&#160;&#160;</tspan><tspan fill="#B9B2FF">effort</tspan><tspan fill="#E8E9EE">: </tspan><tspan fill="#D7FF3D">'high'</tspan><tspan fill="#E8E9EE">,</tspan></text>
    <text x="900" y="570"><tspan fill="#E8E9EE">&#160;&#160;},</tspan></text>
    <text x="900" y="630"><tspan fill="#E8E9EE">&#160;&#160;</tspan><tspan fill="#B9B2FF">fallbacks</tspan><tspan fill="#E8E9EE">: </tspan><tspan fill="#D7FF3D">'default'</tspan><tspan fill="#E8E9EE">,</tspan></text>
    <text x="900" y="690"><tspan fill="#E8E9EE">});</tspan></text>
  </g>
</svg>
</body>
</html>
