<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model picker</title>
<style>
  @font-face {font-family: 'Bricolage'; src: url('../../../../../../src/app/_fonts/bricolage-grotesque-latin-variable.woff2') format('woff2'); font-weight: 200 800;}
  @font-face {font-family: 'Geist'; src: url('../../../../../../src/app/_fonts/geist-latin-variable.woff2') format('woff2'); font-weight: 100 900;}
  @font-face {font-family: 'Geist Mono'; src: url('../../../../../../src/app/_fonts/geist-mono-latin-variable.woff2') format('woff2'); font-weight: 100 900;}
  body {margin: 0; background: #fff;}
  .eyebrow {font: 500 32px 'Geist Mono', monospace; letter-spacing: .08em; fill: #565B67;}
  .h {font: 700 70px 'Bricolage', sans-serif; letter-spacing: -.03em; fill: #0D0E12;}
  .q {font: 500 40px 'Geist', sans-serif; fill: #0D0E12;}
  .m {font: 700 56px 'Bricolage', sans-serif; letter-spacing: -.02em;}
  .note {font: 500 33px 'Geist Mono', monospace; fill: #565B67;}
  .tag {font: 600 26px 'Geist Mono', monospace; letter-spacing: .08em; fill: #0D0E12;}
  .foot {font: 400 30px 'Geist Mono', monospace; fill: #565B67;}
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="1572" viewBox="0 0 1200 1572">
  <title>Which Claude model for which job</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.3" fill="#E1E4EA"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3B2BFF"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="1571" rx="28" fill="#fff" stroke="#E3E5EA"/>
  <rect x="1" y="1" width="1198" height="1569" rx="28" fill="url(#dots)"/>

  <text x="60" y="100" class="eyebrow">PICKING A MODEL</text>
  <text x="60" y="182" class="h">Which model for which job</text>

  <!-- Row 1 -->
  <rect x="60" y="240" width="1080" height="130" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="96" y="296" class="q">Routine fix, chat, classification,</text>
  <text x="96" y="346" class="q">high-volume work?</text>
  <line x1="600" y1="378" x2="600" y2="428" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="60" y="436" width="1080" height="130" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="96" y="500" class="m" fill="#0D0E12">Haiku 5.5 or Sonnet 5.5</text>
  <text x="96" y="546" class="note">low or medium effort</text>

  <g transform="translate(0,46)">
  <!-- Row 2 -->
  <rect x="60" y="620" width="1080" height="130" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="96" y="676" class="q">Everyday coding and</text>
  <text x="96" y="726" class="q">knowledge work?</text>
  <line x1="600" y1="758" x2="600" y2="808" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="60" y="816" width="1080" height="130" rx="22" fill="#fff" stroke="#0D0E12" stroke-width="3"/>
  <rect x="92.6" y="866" width="219.7" height="20" fill="#D7FF3D"/>
  <text x="96" y="882" class="m" fill="#0D0E12">Opus 5.5</text>
  <rect x="356" y="840" width="227" height="50" rx="25" fill="#D7FF3D"/>
  <text x="380" y="874" class="tag">START HERE</text>
  <text x="96" y="926" class="note">Anthropic's default pick</text>

  </g>
  <g transform="translate(0,92)">
  <!-- Row 3 -->
  <rect x="60" y="1000" width="1080" height="130" rx="22" fill="#fff" stroke="#E3E5EA" stroke-width="2"/>
  <text x="96" y="1056" class="q">Multi-repo change, deep audit,</text>
  <text x="96" y="1106" class="q">multi-hour agent run?</text>
  <line x1="600" y1="1138" x2="600" y2="1188" stroke="#3B2BFF" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="60" y="1196" width="1080" height="130" rx="22" fill="#0D0E12"/>
  <text x="96" y="1260" class="m" fill="#fff">Fable 5.2</text>
  <text x="96" y="1306" class="note" style="fill:#B9B2FF">high effort, $8 / $40 per M tokens</text>

  </g>
  <text x="60" y="1484" class="foot">Based on Anthropic's launch post and docs,</text>
  <text x="60" y="1526" class="foot">November 2026 · cgdiomampo.dev</text>
</svg>
</body>
</html>
